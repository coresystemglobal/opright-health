paths:
  /hospitals:
    get:
      summary: List all hospitals
      tags: [Hospitals]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Hospitals retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
    post:
      summary: Create a hospital (super_admin only)
      tags: [Hospitals]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - address
                - phone
              properties:
                name:
                  type: string
                  example: General Hospital Lagos
                address:
                  type: string
                  example: '1 Medical Drive, Lagos'
                phone:
                  type: string
                  example: '+2341234567890'
                email:
                  type: string
                  format: email
      responses:
        '201':
          description: Hospital created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/Hospital'

  /hospitals/{id}:
    get:
      summary: Get hospital by ID
      tags: [Hospitals]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Hospital retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/Hospital'
        '404':
          description: Hospital not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update hospital details
      tags: [Hospitals]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                address:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Hospital updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/Hospital'
    delete:
      summary: Soft delete hospital (super_admin only)
      tags: [Hospitals]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Hospital deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

  /hospitals/{id}/status:
    patch:
      summary: Toggle hospital active/inactive status
      tags: [Hospitals]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Status toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      is_active:
                        type: boolean
