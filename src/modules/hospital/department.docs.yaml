paths:
  /departments:
    get:
      summary: List all departments
      tags: [Departments]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Departments retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
    post:
      summary: Create a department
      tags: [Departments]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - hospital_id
              properties:
                name:
                  type: string
                  example: Cardiology
                hospital_id:
                  type: string
                  format: uuid
                type:
                  type: string
                  example: clinical
                capacity:
                  type: integer
                  example: 50
                head_doctor_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Department created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/Department'

  /departments/{id}:
    get:
      summary: Get department by ID
      tags: [Departments]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Department retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/Department'
        '404':
          description: Department not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update department details
      tags: [Departments]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                capacity:
                  type: integer
                head_doctor_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Department updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/Department'
    delete:
      summary: Deactivate a department
      tags: [Departments]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Department deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

  /departments/{id}/staff:
    get:
      summary: List staff in a department
      tags: [Departments]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Department staff retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
    post:
      summary: Assign a staff member to a department
      tags: [Departments]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
              properties:
                user_id:
                  type: string
                  format: uuid
                role_in_department:
                  type: string
                  example: senior_nurse
      responses:
        '201':
          description: Staff assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

  /departments/{id}/analytics:
    get:
      summary: Get department analytics (occupancy, metrics)
      tags: [Departments]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Department analytics retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      occupancy_rate:
                        type: number
                        example: 75.5
                      total_patients:
                        type: integer
                      total_staff:
                        type: integer
                      appointments_today:
                        type: integer

  /departments/{id}/staff/{assignmentId}:
    delete:
      summary: Remove a staff member from a department
      tags: [Departments]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Department ID
        - in: path
          name: assignmentId
          required: true
          schema:
            type: string
            format: uuid
          description: Staff assignment ID
      responses:
        '200':
          description: Staff removed from department
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
