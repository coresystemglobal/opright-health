paths:
  /files/upload:
    post:
      summary: Upload a file
      description: Uploads a file to cloud storage. Requires authentication and X-Tenant-ID header.
      tags: [Files]
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Tenant-ID
          required: true
          schema:
            type: string
            format: uuid
          description: Tenant identifier
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File to upload (max 10MB)
                category:
                  type: string
                  example: patient_record
                related_id:
                  type: string
                  format: uuid
                  description: ID of the related resource (e.g. patient ID)
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/FileRecord'
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /files:
    get:
      summary: List uploaded files
      description: Returns files for the authenticated tenant. Requires X-Tenant-ID header.
      tags: [Files]
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Tenant-ID
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Files retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'

  /files/{id}:
    delete:
      summary: Delete a file
      description: Permanently removes a file from storage. Requires X-Tenant-ID header.
      tags: [Files]
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Tenant-ID
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: File deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
