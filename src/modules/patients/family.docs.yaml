paths:
  /family:
    get:
      summary: List own family members
      description: Returns family members linked to the authenticated patient
      tags: [Family Members]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Family members retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FamilyMember'
    post:
      summary: Add a family member
      tags: [Family Members]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - first_name
                - last_name
                - relationship
              properties:
                first_name:
                  type: string
                  example: Emma
                last_name:
                  type: string
                  example: Smith
                relationship:
                  type: string
                  enum: [child, spouse, parent, sibling, grandparent, grandchild, other]
                  example: spouse
                date_of_birth:
                  type: string
                  format: date
                blood_type:
                  type: string
                  enum: ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-']
                gender:
                  type: string
                  enum: [male, female, other]
                phone:
                  type: string
                allergies:
                  type: string
                medical_notes:
                  type: string
      responses:
        '201':
          description: Family member added
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/FamilyMember'

  /family/{id}:
    get:
      summary: Get a family member by ID
      tags: [Family Members]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Family member retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/FamilyMember'
        '404':
          description: Family member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update a family member
      tags: [Family Members]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                relationship:
                  type: string
                phone:
                  type: string
                allergies:
                  type: string
                medical_notes:
                  type: string
      responses:
        '200':
          description: Family member updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/FamilyMember'
    delete:
      summary: Remove a family member (soft delete)
      tags: [Family Members]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Family member removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
