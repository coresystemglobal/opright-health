paths:
  /roles:
    get:
      summary: List all roles
      tags: [Roles]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Roles retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
    post:
      summary: Create a new role
      tags: [Roles]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: senior_nurse
                description:
                  type: string
                  example: Senior nursing staff role
      responses:
        '201':
          description: Role created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/Role'

  /roles/assign:
    post:
      summary: Assign a role to a user
      tags: [Roles]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - role_id
              properties:
                user_id:
                  type: string
                  format: uuid
                role_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Role assigned to user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

  /roles/seed:
    post:
      summary: Seed default system roles
      description: Idempotent — safe to run multiple times. Creates default roles if they do not exist.
      tags: [Roles]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Default roles seeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

  /roles/{id}:
    get:
      summary: Get role by ID
      tags: [Roles]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Role retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/Role'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /roles/{id}/permissions:
    get:
      summary: Get permissions assigned to a role
      tags: [Roles]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Role permissions retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Permission'
    post:
      summary: Assign permissions to a role
      tags: [Roles]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - permission_ids
              properties:
                permission_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Permissions assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
    delete:
      summary: Remove permissions from a role
      tags: [Roles]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - permission_ids
              properties:
                permission_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Permissions removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

  /roles/{id}/users:
    get:
      summary: Get users assigned to a role
      tags: [Roles]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Users with this role retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
