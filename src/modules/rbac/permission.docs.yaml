paths:
  /permissions:
    get:
      summary: List all permissions
      tags: [Permissions]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Permissions retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Permission'
    post:
      summary: Create a new permission
      tags: [Permissions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - resource
                - action
              properties:
                name:
                  type: string
                  example: PATIENT_EXPORT
                resource:
                  type: string
                  example: patient
                action:
                  type: string
                  example: export
                description:
                  type: string
                  example: Can export patient records
      responses:
        '201':
          description: Permission created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/Permission'

  /permissions/seed:
    post:
      summary: Seed default system permissions
      description: Idempotent — creates default permissions if they do not exist.
      tags: [Permissions]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Default permissions seeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

  /permissions/{id}:
    get:
      summary: Get permission by ID
      tags: [Permissions]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Permission retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/Permission'
        '404':
          description: Permission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update a permission
      tags: [Permissions]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Permission updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/Permission'
    delete:
      summary: Delete a permission
      tags: [Permissions]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Permission deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
