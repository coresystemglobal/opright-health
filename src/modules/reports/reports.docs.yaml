paths:
  /reports/patient-demographics:
    get:
      summary: Get patient demographics report
      tags: [Reports]
      parameters:
        - in: query
          name: startDate
          schema:
            type: string
            format: date
            example: '2026-01-01'
        - in: query
          name: endDate
          schema:
            type: string
            format: date
            example: '2026-06-30'
      responses:
        '200':
          description: Demographics report data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      total_patients:
                        type: integer
                      gender_breakdown:
                        type: object
                      age_groups:
                        type: object
                      blood_type_distribution:
                        type: object

  /reports/doctor-performance:
    get:
      summary: Get doctor performance report
      tags: [Reports]
      parameters:
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
        - in: query
          name: doctorId
          schema:
            type: string
            format: uuid
          description: Filter by specific doctor
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Doctor performance report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'

  /reports/financial:
    get:
      summary: Get financial report
      tags: [Reports]
      parameters:
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Financial report data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      total_revenue:
                        type: number
                      total_invoiced:
                        type: number
                      total_outstanding:
                        type: number

  /reports/appointment-analytics:
    get:
      summary: Get appointment analytics report
      tags: [Reports]
      parameters:
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Appointment analytics data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                      by_status:
                        type: object
                      no_show_rate:
                        type: number

  /reports/system-health:
    get:
      summary: Get system health report (admin only)
      tags: [Reports]
      responses:
        '200':
          description: System health metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      db_health:
                        type: string
                      uptime_seconds:
                        type: integer
                      memory_usage:
                        type: object

  /reports/custom:
    post:
      summary: Generate a custom report
      tags: [Reports]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reportType
              properties:
                reportType:
                  type: string
                  example: patient_visits
                parameters:
                  type: object
                  properties:
                    startDate:
                      type: string
                      format: date
                    endDate:
                      type: string
                      format: date
      responses:
        '200':
          description: Custom report generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object

  /reports/export:
    get:
      summary: Export a report in various formats
      tags: [Reports]
      parameters:
        - in: query
          name: reportType
          required: true
          schema:
            type: string
            example: financial
        - in: query
          name: format
          schema:
            type: string
            enum: [json, csv, pdf]
            default: json
      responses:
        '200':
          description: Report exported (content type varies by format)
